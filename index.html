<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapa dos Campi da UCSal — 65 Anos</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="map"></div>

    <div id="painel-filtros">
      <h3>Campi da UCSal</h3>
      <div class="grupo-botoes">
        <button id="filtro-todos" class="ativo-selecionado">Todos</button>
        <button id="filtro-ativos">Ativos</button>
        <button id="filtro-inativos">Inativos</button>
      </div>
      <label>
        <input type="checkbox" id="toggle-nacional" />
        Mostrar universidades católicas do Brasil
      </label>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="js/data.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/map.js"></script>
  </body>
</html>
